name: "Lint PR Title"

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize

jobs:

  # 1. PROTEZIONE: Controlla che la PR abbia le label corrette
  check_labels:
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR Labels
        run: |
          LABELS="${{ join(github.event.pull_request.labels.*.name, ',') }}"
          echo "Labels trovate: $LABELS"
          
          # Regex per le tue label specifiche
          ALLOWED_PATTERN="feat|fix|chore|docs|style|refactor|perf|test|breaking|sync"
          
          if [[ -z "$LABELS" ]]; then
            echo "❌ ERRORE: Nessuna etichetta trovata! Aggiungi una label (es. feat, fix) alla PR."
            exit 1
          fi
          
          if [[ ! "$LABELS" =~ $ALLOWED_PATTERN ]]; then
            echo "❌ ERRORE: Label non valida. Usa una di queste: $ALLOWED_PATTERN"
            exit 1
          fi
          echo "✅ Label valida riscontrata."

  main:
    needs: [check_labels]
    permissions:
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Lista dei prefissi accettati
          types: |
            feat
            fix
            chore
            docs
            style
            refactor
            perf
            test
            breaking
            sync
          # Richiede che ci sia almeno un tipo valido
          requireScope: false
